server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

live_store:
  max_trace_idle: 10s
  max_block_duration: 5m

# Retention is enforced by the backend worker; the scheduler's copy is ignored.
backend_worker:
  compaction:
    block_retention: 72h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
