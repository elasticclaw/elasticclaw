server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

live_store:
  max_trace_idle: 10s
  max_block_duration: 5m

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 72h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
