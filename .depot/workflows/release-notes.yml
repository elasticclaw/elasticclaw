name: Generate Release Notes

on:
  push:
    tags:
      # Non-prerelease CalVer tags only (no hyphen suffix)
      - '20[0-9][0-9].[0-9]+.[0-9]+'
      - '20[0-9][0-9].[0-9]+.[0-9]+.[0-9]+'

jobs:
  generate-release-notes:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}  # skip prereleases
    outputs:
      title: ${{ steps.parsed.outputs.title }}
      summary: ${{ steps.parsed.outputs.summary }}
      whatsNew: ${{ steps.parsed.outputs.whatsNew }}
      improvements: ${{ steps.parsed.outputs.improvements }}
      fixes: ${{ steps.parsed.outputs.fixes }}
    steps:
      - name: Validate release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VALID_TAG_RE='^20[0-9]{2}\.([1-9]|1[0-2])\.([1-9]|[12][0-9]|3[01])(\.[1-9][0-9]*)?$'
          if [[ ! "$TAG" =~ $VALID_TAG_RE ]]; then
            printf '%s\n' \
              "Invalid release tag: ${TAG}" \
              "" \
              "Release tags must use unpadded CalVer components:" \
              "  valid:   2026.7.7" \
              "  valid:   2026.7.7.1" \
              "  invalid: 2026.07.07" \
              "" \
              "Do not use leading zeros for month, day, or hotfix numbers." >&2
            exit 1
          fi

      - name: Checkout elasticclaw
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for changelog

      - name: Get previous tag
        id: prev
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git tag --sort=-v:refname | grep -E '^20[0-9]+\.[0-9]+\.[0-9]+' | grep -v '\-' | head -n 2 | tail -n 1)
          if [ "$PREV" = "$TAG" ]; then
            # First release ever — get all commits
            PREV=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Generate raw changelog
        id: changelog
        run: |
          PREV="${{ steps.prev.outputs.tag }}"
          # Exclude commits that only touch internal paths:
          #   .elasticclaw/      — our own factory configs
          #   .depot/           — CI/workflows
          #   hack/             — internal scripts
          #   scripts/          — internal scripts
          git log --pretty=format:'%h %s (%an)' \
            "$PREV..${GITHUB_REF_NAME}" \
            -- . \
            ':(exclude).elasticclaw' \
            ':(exclude).depot' \
            ':(exclude)hack' \
            ':(exclude)scripts' \
            > /tmp/changelog.txt
          # Guard: if every commit touched excluded paths, the changelog is empty.
          # Write a placeholder so the Groq step doesn't hallucinate or fail on empty input.
          if [ ! -s /tmp/changelog.txt ]; then
            echo "No user-facing changes in this release." > /tmp/changelog.txt
          fi

      - name: Generate release notes with Groq
        id: groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          # Build the prompt JSON safely with Python (handles quotes, newlines, backslashes)
          cat > /tmp/build_prompt.py << 'PYEOF'
          import json, sys

          tag = sys.argv[1]
          with open("/tmp/changelog.txt", "r") as f:
            commits = f.read()

          prompt = {
            "model": "openai/gpt-oss-120b",
            "messages": [
              {"role": "system", "content": "You are a technical writer who writes engaging, human-friendly release notes for developer tools. You write in a casual but informative tone. You categorize changes into: What's New (features), Improvements (enhancements), Fixes (bug fixes). Be descriptive and specific — mention what changed and why it matters. Don't just list commit messages. Release titles must be concise, fresh, and varied across releases. Do NOT use sitcom-style titles like \"The One With...\", \"The One Where...\", or any title beginning with \"The One\". Do NOT use generic titles like \"Bug Fixes and Improvements\", \"Release Update\", or \"What's New\"."},
              {"role": "user", "content": "Write release notes for ElasticClaw version " + tag + ". Here are the commits since the last release:\n\n" + commits + "\n\nCreate a title that is 2-7 words, specific to the most important change, and uses one of these varied styles: crisp product headline, action phrase, metaphor, workshop/tooling phrase, or short playful phrase. Avoid copying these examples, but aim for this kind of variety: \"Sharper Factory Signals\", \"Bridge Work, Less Guesswork\", \"A Cleaner Claw Path\", \"Issue Triage Gets Teeth\", \"Bootstraps That Stick\".\n\nRespond with ONLY a JSON object in this exact shape (no markdown code block, no extra text):\n{\n  \"title\": \"creative title here\",\n  \"whatsNew\": [\"descriptive bullet\", \"another bullet\"],\n  \"improvements\": [\"descriptive bullet\"],\n  \"fixes\": [\"descriptive bullet\"],\n  \"summary\": \"one-line teaser for the release list page\"\n}"}
            ],
            "temperature": 0.95,
            "max_tokens": 4096
          }

          with open("/tmp/prompt.json", "w") as f:
            json.dump(prompt, f)
          PYEOF
          python3 /tmp/build_prompt.py "$TAG"

          RESPONSE=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/prompt.json)

          echo "$RESPONSE" > /tmp/groq_response.json

          # Extract JSON content from response
          CONTENT=$(jq -r '.choices[0].message.content // empty' /tmp/groq_response.json)
          if [ -z "$CONTENT" ]; then
            echo "Groq response:" >&2
            cat /tmp/groq_response.json >&2
            exit 1
          fi

          # Clean up markdown code fences if present
          echo "$CONTENT" | sed 's/^```json//; s/^```//; s/```$//' > /tmp/notes.json

          # Guard against repetitive or generic titles even if the model ignores the prompt.
          cat > /tmp/vary_title.py << 'PYEOF'
          import hashlib, json, re

          with open("/tmp/notes.json", "r") as f:
            notes = json.load(f)
          with open("/tmp/changelog.txt", "r") as f:
            changelog = f.read()

          title = str(notes.get("title") or "").strip()
          boring_patterns = [
            r"^the one\b",
            r"^what'?s new\b",
            r"^release update\b",
            r"^bug fixes? and improvements?$",
            r"^improvements? and fixes?$",
            r"^elasticclaw (release|update)\b",
          ]

          def boring(s):
            if not s:
              return True
            normalized = re.sub(r"\s+", " ", s.strip().lower())
            if len(normalized.split()) > 7:
              return True
            return any(re.search(pattern, normalized) for pattern in boring_patterns)

          def category(text):
            lowered = text.lower()
            categories = [
              ("Factory Signals", ["factory", "factories", "trigger", "webhook", "issue"]),
              ("Bridge Work", ["bridge", "bootstrap", "connector", "openclaw"]),
              ("Sharper Sandboxes", ["sandbox", "replicated", "daytona", "exedev", "vm"]),
              ("Cleaner Pipelines", ["pipeline", "stage", "done", "pr"]),
              ("Quieter Settings", ["settings", "config", "doctor", "secret"]),
              ("Tighter GitHub Flow", ["github", "repo", "pull request", "comment"]),
            ]
            for label, words in categories:
              if any(word in lowered for word in words):
                return label
            return "Sharper Claw Work"

          fallback_templates = [
            "{topic}, Less Guesswork",
            "Cleaner {topic}",
            "{topic} That Stick",
            "More from {topic}",
            "{topic}, Sharper Now",
            "Smoother {topic}",
            "Tighter {topic}",
            "{topic}, Tuned Up",
          ]

          if boring(title):
            topic = category(changelog)
            idx = int(hashlib.sha256(changelog.encode("utf-8")).hexdigest()[:8], 16) % len(fallback_templates)
            notes["title"] = fallback_templates[idx].format(topic=topic)
            with open("/tmp/notes.json", "w") as f:
              json.dump(notes, f, indent=2)
          PYEOF
          python3 /tmp/vary_title.py

      - name: Parse release notes
        id: parsed
        run: |
          jq -r '.title' /tmp/notes.json > /tmp/title.txt
          jq -r '.summary' /tmp/notes.json > /tmp/summary.txt
          jq -c '.whatsNew' /tmp/notes.json > /tmp/whatsnew.json
          jq -c '.improvements' /tmp/notes.json > /tmp/improvements.json
          jq -c '.fixes' /tmp/notes.json > /tmp/fixes.json

          # Use heredoc for multi-line-safe GITHUB_OUTPUT
          {
            echo "title<<GH_EOF"
            cat /tmp/title.txt
            echo "GH_EOF"
            echo "summary<<GH_EOF"
            cat /tmp/summary.txt
            echo "GH_EOF"
            echo "whatsNew<<GH_EOF"
            cat /tmp/whatsnew.json
            echo "GH_EOF"
            echo "improvements<<GH_EOF"
            cat /tmp/improvements.json
            echo "GH_EOF"
            echo "fixes<<GH_EOF"
            cat /tmp/fixes.json
            echo "GH_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout elasticclaw.ai
        uses: actions/checkout@v4
        with:
          repository: elasticclaw/elasticclaw.ai
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: docs-repo

      - name: Update release notes pages
        run: |
          TAG="${GITHUB_REF_NAME}"
          DATE="$(date -u +%Y-%m-%d)"

          cd docs-repo

          # Update the list page (release-notes/page.tsx)
          cat > /tmp/update_list.py << 'PYEOF'
          import re, sys

          tag = sys.argv[1]
          date = sys.argv[2]

          with open("/tmp/title.txt", "r") as f:
            title = f.read().strip()
          with open("/tmp/summary.txt", "r") as f:
            summary = f.read().strip()

          list_file = sys.argv[3]
          with open(list_file, "r") as f:
            content = f.read()

          # Escape for TSX string literals
          def esc(s):
            return s.replace("\\", "\\\\").replace('"', '\\"').replace("\n", "\\n")

          new_entry = (
            '  {\n'
            '    version: "' + tag + '",\n'
            '    date: "' + date + '",\n'
            '    title: "' + esc(title) + '",\n'
            '    summary: "' + esc(summary) + '",\n'
            '  },'
          )

          pattern = r"(const RELEASES: Release\[\] = \[)"
          original_content = content
          content = re.sub(pattern, lambda m: m.group(1) + "\n" + new_entry, content, count=1)
          assert content != original_content, "Pattern not found in list page file"

          with open(list_file, "w") as f:
            f.write(content)
          PYEOF
          python3 /tmp/update_list.py "$TAG" "$DATE" "src/app/docs/release-notes/page.tsx"

          # Update the detail page (release-notes/[version]/page.tsx)
          cat > /tmp/update_detail.py << 'PYEOF'
          import json, re, sys

          tag = sys.argv[1]
          date = sys.argv[2]

          with open("/tmp/title.txt", "r") as f:
            title = f.read().strip()
          with open("/tmp/whatsnew.json", "r") as f:
            whatsnew = json.load(f) or []
          with open("/tmp/improvements.json", "r") as f:
            improvements = json.load(f) or []
          with open("/tmp/fixes.json", "r") as f:
            fixes = json.load(f) or []
          with open("/tmp/changelog.txt", "r") as f:
            raw_changelog = f.read()

          detail_file = sys.argv[3]
          with open(detail_file, "r") as f:
            content = f.read()

          # Escape for TSX string literals
          def esc(s):
            return s.replace("\\", "\\\\").replace('"', '\\"').replace("\n", "\\n")

          def fmt_list(items):
            lines = ['    "' + esc(item) + '",' for item in items]
            return "\n".join(lines)

          new_entry = (
            '  "' + esc(tag) + '": {\n'
            '    version: "' + esc(tag) + '",\n'
            '    date: "' + date + '",\n'
            '    title: "' + esc(title) + '",\n'
            '    whatsNew: [\n'
            + fmt_list(whatsnew) + '\n'
            '    ],\n'
            '    improvements: [\n'
            + fmt_list(improvements) + '\n'
            '    ],\n'
            '    fixes: [\n'
            + fmt_list(fixes) + '\n'
            '    ],\n'
            '    rawChangelog: "' + esc(raw_changelog) + '",\n'
            '  },'
          )

          pattern = r"(const RELEASE_DETAILS: Record<string, ReleaseDetail> = \{)"
          original_content = content
          content = re.sub(pattern, lambda m: m.group(1) + "\n" + new_entry, content, count=1)
          assert content != original_content, "Pattern not found in detail page file"

          with open(detail_file, "w") as f:
            f.write(content)
          PYEOF
          python3 /tmp/update_detail.py "$TAG" "$DATE" "src/app/docs/release-notes/[version]/page.tsx"

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: docs-repo
          branch: release-notes-${{ github.ref_name }}
          title: "docs: release notes for ${{ github.ref_name }}"
          body: |
            Automated release notes for **${{ github.ref_name }}**.

            Generated by Groq (gpt-oss-120b) from commit history.

            - Title: ${{ steps.parsed.outputs.title }}
            - Summary: ${{ steps.parsed.outputs.summary }}
          commit-message: "docs: release notes for ${{ github.ref_name }}"
          delete-branch: true

  notify-discord:
    name: Announce on Discord
    runs-on: ubuntu-latest
    needs: generate-release-notes
    permissions:
      contents: read
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the GitHub Release
        if: env.DISCORD_WEBHOOK != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The Release workflow fires off the same tag but runs in parallel, and
          # it has to build binaries for five platforms first. Announcing before
          # it finishes would link people to a release page with no downloads.
          for _ in $(seq 1 60); do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 30
          done
          echo "GitHub Release ${GITHUB_REF_NAME} did not appear within 30 minutes" >&2
          exit 1

      - name: Post changelog to Discord
        if: env.DISCORD_WEBHOOK != ''
        env:
          TAG: ${{ github.ref_name }}
          DISCORD_MODE: changelog
          NOTES_TITLE: ${{ needs.generate-release-notes.outputs.title }}
          NOTES_SUMMARY: ${{ needs.generate-release-notes.outputs.summary }}
          NOTES_WHATS_NEW: ${{ needs.generate-release-notes.outputs.whatsNew }}
          NOTES_IMPROVEMENTS: ${{ needs.generate-release-notes.outputs.improvements }}
          NOTES_FIXES: ${{ needs.generate-release-notes.outputs.fixes }}
        run: ./hack/discord-release-notify.sh
