name: Update Homebrew Tap

on:
  release:
    types: [published]

jobs:
  update-tap:
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Update Homebrew formula
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}  # PAT with write access to homebrew-elasticclaw
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION_NO_V="${VERSION#v}"

          # Wait for binaries to be uploaded (release.yaml uploads after creating release)
          for i in $(seq 1 20); do
            if curl -fsSLo elasticclaw-darwin-arm64 \
              "https://github.com/elasticclaw/elasticclaw/releases/download/${VERSION}/elasticclaw-darwin-arm64" 2>/dev/null; then
              echo "Downloaded arm64 binary (attempt ${i})"
              break
            fi
            echo "Waiting for binaries... attempt ${i}/20"
            sleep 30
          done
          curl -fsSLo elasticclaw-darwin-amd64 \
            "https://github.com/elasticclaw/elasticclaw/releases/download/${VERSION}/elasticclaw-darwin-amd64"

          SHA_ARM64=$(sha256sum elasticclaw-darwin-arm64 | awk '{print $1}')
          SHA_AMD64=$(sha256sum elasticclaw-darwin-amd64 | awk '{print $1}')

          # Clone the tap repo
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/elasticclaw/homebrew-elasticclaw.git" tap
          cd tap

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Update the formula
          sed -i "s/version \".*\"/version \"${VERSION_NO_V}\"/" Formula/elasticclaw.rb
          sed -i "s/PLACEHOLDER_ARM64_SHA256/${SHA_ARM64}/" Formula/elasticclaw.rb
          sed -i "s/PLACEHOLDER_AMD64_SHA256/${SHA_AMD64}/" Formula/elasticclaw.rb

          # Replace sha256 on existing releases too
          # (handles the case where the formula already has real sha256s from a previous release)
          ARM64_LINE=$(grep -n "on_arm" Formula/elasticclaw.rb | head -1 | cut -d: -f1)
          AMD64_LINE=$(grep -n "on_intel" Formula/elasticclaw.rb | head -1 | cut -d: -f1)

          # Use awk to replace sha256 on the correct architecture blocks
          awk -v arm_sha="${SHA_ARM64}" -v amd_sha="${SHA_AMD64}" '
            /on_arm/ { in_arm=1 }
            /on_intel/ { in_arm=0; in_amd=1 }
            /end/ { in_arm=0; in_amd=0 }
            in_arm && /sha256/ { sub(/sha256 ".*"/, "sha256 \"" arm_sha "\"") }
            in_amd && /sha256/ { sub(/sha256 ".*"/, "sha256 \"" amd_sha "\"") }
            { print }
          ' Formula/elasticclaw.rb > Formula/elasticclaw.rb.tmp
          mv Formula/elasticclaw.rb.tmp Formula/elasticclaw.rb

          git add Formula/elasticclaw.rb
          git diff --staged --quiet || git commit -m "elasticclaw ${VERSION}"
          git push
