name: Publish ElasticClaw Workspace

on:
  push:
    branches:
      - main
    paths:
      - '.elasticclaw/**'
  workflow_dispatch:

jobs:
  publish:
    name: Publish workspace and workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish workspace (elasticclaw)
        uses: elasticclaw/actions/publish-workspace@main
        with:
          hub-endpoint: https://factory.elasticclaw.ai
          token: ${{ secrets.ELASTICCLAW_TOKEN }}
          path: .elasticclaw/workspaces/elasticclaw

      - name: Publish workflow (github-issue)
        uses: elasticclaw/actions/publish-workflow@main
        with:
          hub-endpoint: https://factory.elasticclaw.ai
          token: ${{ secrets.ELASTICCLAW_TOKEN }}
          workspace: elasticclaw
          path: .elasticclaw/workflows/github-issue.yaml

      # Intentionally not publishing .elasticclaw/workflows/linear-story.yaml yet.
      # The Linear workflow is local test config until its server-side tracker setup is ready.
