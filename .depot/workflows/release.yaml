name: Release

on:
  push:
    tags:
      # CalVer: YYYY.MM.DD (first release of the day)
      - '20[0-9][0-9].[0-9]+.[0-9]+'
      # CalVer: YYYY.MM.DD.MICRO (same-day hotfix)
      - '20[0-9][0-9].[0-9]+.[0-9]+.[0-9]+'
      # CalVer prerelease suffix (e.g. 2026.05.11-rc1)
      - '20[0-9][0-9].[0-9]+.[0-9]+-*'
      - '20[0-9][0-9].[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  release:
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Validate release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VALID_TAG_RE='^20[0-9]{2}\.([1-9]|1[0-2])\.([1-9]|[12][0-9]|3[01])(\.[1-9][0-9]*)?(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
          if [[ ! "$TAG" =~ $VALID_TAG_RE ]]; then
            printf '%s\n' \
              "Invalid release tag: ${TAG}" \
              "" \
              "Release tags must use unpadded CalVer components:" \
              "  valid:   2026.7.7" \
              "  valid:   2026.7.7.1" \
              "  valid:   2026.7.7-rc1" \
              "  invalid: 2026.07.07" \
              "" \
              "Do not use leading zeros for month, day, or hotfix numbers." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package.json'

      - name: Build web UI
        run: make build-web

      - name: Determine prerelease
        id: prerelease
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Prerelease if tag contains a hyphen (e.g. 2026.7.7-rc1)
          if echo "$TAG" | grep -qE '^20[0-9]{2}\.[0-9]+\.[0-9]+(\.[0-9]+)?-.+'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::7}"
          LDFLAGS="-X github.com/elasticclaw/elasticclaw/cmd.Version=${VERSION} \
                   -X github.com/elasticclaw/elasticclaw/cmd.Commit=${COMMIT} \
                   -X github.com/elasticclaw/elasticclaw/cmd.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          mkdir -p dist

          # elasticclaw CLI
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -tags embedweb -ldflags "$LDFLAGS" -o dist/elasticclaw-linux-amd64   .
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -tags embedweb -ldflags "$LDFLAGS" -o dist/elasticclaw-linux-arm64   .
          GOOS=darwin  GOARCH=amd64 go build -tags embedweb -ldflags "$LDFLAGS" -o dist/elasticclaw-darwin-amd64  .
          GOOS=darwin  GOARCH=arm64 go build -tags embedweb -ldflags "$LDFLAGS" -o dist/elasticclaw-darwin-arm64  .
          GOOS=windows GOARCH=amd64 go build -tags embedweb -ldflags "$LDFLAGS" -o dist/elasticclaw-windows-amd64.exe .

          # claw-bridge (VM-side agent; only needs linux/amd64)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/claw-bridge-linux-amd64 ./cmd/claw-bridge/

          # Checksums
          cd dist && sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/elasticclaw-linux-amd64
            dist/elasticclaw-linux-arm64
            dist/elasticclaw-darwin-amd64
            dist/elasticclaw-darwin-arm64
            dist/elasticclaw-windows-amd64.exe
            dist/claw-bridge-linux-amd64
            dist/checksums.txt

  update-homebrew:
    runs-on: depot-ubuntu-24.04
    needs: release
    # Stable tags → Formula/elasticclaw.rb (bin: elasticclaw)
    # Prerelease tags (CalVer with hyphen, e.g. 2026.8.8-rc1) →
    # Formula/elasticclaw-beta.rb (bin: elasticclaw-beta), matching adversarylabs/adversary.
    steps:
      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          VERSION_NO_V="${VERSION#v}"

          # Prerelease if tag contains a hyphen (same rule as Create GitHub Release).
          if echo "$VERSION" | grep -qE '^20[0-9]{2}\.[0-9]+\.[0-9]+(\.[0-9]+)?-.+'; then
            FORMULA_FILE="elasticclaw-beta.rb"
            FORMULA_CLASS="ElasticclawBeta"
            INSTALLED_BINARY="elasticclaw-beta"
            COMMIT_MSG="elasticclaw-beta ${VERSION}"
          else
            FORMULA_FILE="elasticclaw.rb"
            FORMULA_CLASS="Elasticclaw"
            INSTALLED_BINARY="elasticclaw"
            COMMIT_MSG="elasticclaw ${VERSION}"
          fi

          # Read the checksums from the release asset instead of re-hashing each
          # binary. The binaries embed the web UI, so they are large. One small
          # request replaces four big downloads. The release job writes this file
          # with "sha256sum *", so field 2 is the bare asset name.
          CHECKSUMS=$(curl -fsSL "https://github.com/elasticclaw/elasticclaw/releases/download/${VERSION}/checksums.txt")
          sha_for() {
            printf '%s\n' "$CHECKSUMS" | awk -v name="$1" '$2 == name { print $1 }'
          }

          SHA_DARWIN_ARM64=$(sha_for elasticclaw-darwin-arm64)
          SHA_DARWIN_AMD64=$(sha_for elasticclaw-darwin-amd64)
          SHA_LINUX_ARM64=$(sha_for elasticclaw-linux-arm64)
          SHA_LINUX_AMD64=$(sha_for elasticclaw-linux-amd64)

          # A renamed or absent asset makes sha_for print nothing, and
          # "set -euo pipefail" does not fail on an empty awk result. The tap has
          # no CI, so an empty sha256 would reach users and break every
          # "brew install". Fail here instead.
          for var in SHA_DARWIN_ARM64 SHA_DARWIN_AMD64 SHA_LINUX_ARM64 SHA_LINUX_AMD64; do
            if [[ ! "${!var}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid checksum for ${var}: '${!var}'" >&2
              exit 1
            fi
          done

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/elasticclaw/homebrew-elasticclaw.git" tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p Formula

          # Generate the formula in full so stable and beta stay in lockstep
          # (class name + installed binary differ for prereleases).
          cat > "Formula/${FORMULA_FILE}" <<EOF
          class ${FORMULA_CLASS} < Formula
            desc "Provision and manage AI agent claws from the command line"
            homepage "https://github.com/elasticclaw/elasticclaw"
            version "${VERSION_NO_V}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/elasticclaw/elasticclaw/releases/download/#{version}/elasticclaw-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/elasticclaw/elasticclaw/releases/download/#{version}/elasticclaw-darwin-amd64"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/elasticclaw/elasticclaw/releases/download/#{version}/elasticclaw-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/elasticclaw/elasticclaw/releases/download/#{version}/elasticclaw-linux-amd64"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              os = OS.mac? ? "darwin" : "linux"
              arch = Hardware::CPU.arm? ? "arm64" : "amd64"
              bin.install "elasticclaw-#{os}-#{arch}" => "${INSTALLED_BINARY}"
            end

            test do
              assert_match "elasticclaw", shell_output("#{bin}/${INSTALLED_BINARY} version 2>&1")
            end
          end
          EOF

          git add "Formula/${FORMULA_FILE}"
          git diff --staged --quiet || git commit -m "${COMMIT_MSG}"
          git push
