name: E2E

on:
  pull_request:
  workflow_dispatch:

jobs:
  daytona-github-issues:
    name: Daytona + GitHub Issues
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 35
    env:
      ELASTICCLAW_E2E_BIN: ${{ github.workspace }}/bin/elasticclaw
      ELASTICCLAW_E2E_BRIDGE_BINARY: ${{ github.workspace }}/bin/claw-bridge-linux-amd64
      ELASTICCLAW_E2E_HUB_ADDR: 127.0.0.1:8080
      ELASTICCLAW_E2E_GITHUB_TOKEN: ${{ secrets.ELASTICCLAW_E2E_GITHUB_TOKEN }}
      ELASTICCLAW_E2E_GITHUB_REPO: ${{ vars.ELASTICCLAW_E2E_GITHUB_REPO || 'elasticclaw/e2e-fixtures' }}
      ELASTICCLAW_E2E_GITHUB_APP_ID: ${{ secrets.ELASTICCLAW_E2E_GITHUB_APP_ID }}
      ELASTICCLAW_E2E_GITHUB_APP_URL: ${{ vars.ELASTICCLAW_E2E_GITHUB_APP_URL }}
      ELASTICCLAW_E2E_GITHUB_APP_INSTALLATION: ${{ vars.ELASTICCLAW_E2E_GITHUB_APP_INSTALLATION }}
      ELASTICCLAW_E2E_GITHUB_APP_PRIVATE_KEY: ${{ secrets.ELASTICCLAW_E2E_GITHUB_APP_PRIVATE_KEY }}
      ELASTICCLAW_E2E_MODEL: fireworks/accounts/fireworks/models/kimi-k2p6
      ELASTICCLAW_E2E_RUN_ID: pr-${{ github.event.pull_request.number || github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      NGROK_API_KEY: ${{ secrets.NGROK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
          cache: true

      - name: Build ElasticClaw
        run: |
          go build -o bin/elasticclaw .
          GONOSUMDB=* CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/claw-bridge-linux-amd64 ./cmd/claw-bridge/

      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update
          sudo apt-get install -y ngrok
          ngrok version

      - name: Start ngrok
        run: |
          NGROK_HOST="ec-${GITHUB_SHA:0:12}-${GITHUB_RUN_ATTEMPT}-$(date +%s).ngrok-free.app"
          echo "Stopping existing ngrok agents so this job owns the tunnel"
          pkill -x ngrok >/dev/null 2>&1 || true
          sleep 1
          echo "Creating temporary ngrok reserved domain https://$NGROK_HOST"
          ngrok api reserved-domains create \
            --api-key "$NGROK_API_KEY" \
            --domain "$NGROK_HOST" \
            --description "ElasticClaw E2E temporary tunnel" \
            --metadata "elasticclaw-e2e" > ngrok-domain.json
          python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))' < ngrok-domain.json > ngrok-domain-id
          if [ ! -s ngrok-domain-id ]; then
            cat ngrok-domain.json
            echo "ngrok reserved domain create did not return an id"
            exit 1
          fi
          sleep 5
          echo "Starting ngrok tunnel https://$NGROK_HOST for localhost:8080"
          printf 'version: "3"\n' > ngrok.yml
          ngrok http 8080 --url "https://$NGROK_HOST" --authtoken "$NGROK_AUTHTOKEN" --config ngrok.yml --log stdout > ngrok.log 2>&1 &
          echo "$!" > ngrok.pid
          for i in $(seq 1 30); do
            url="$(curl -fsS http://127.0.0.1:4040/api/tunnels | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((t["public_url"] for t in data.get("tunnels", []) if t.get("proto") == "https"), ""))' 2>/dev/null || true)"
            if [ -n "$url" ]; then
              case "$url" in
                *://elasticclaw.ngrok.app*)
                  echo "Refusing shared ngrok domain: $url"
                  exit 1
                  ;;
              esac
              echo "ELASTICCLAW_E2E_PUBLIC_URL=$url" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat ngrok.log
          exit 1

      - name: Run Daytona GitHub Issues E2E
        run: go test -tags e2e -v ./test/e2e -run TestDaytonaGitHubIssuesWorkflowE2E -count=1 -timeout 30m

      - name: Stop ngrok
        if: always()
        run: |
          if [ -f ngrok.pid ]; then
            kill "$(cat ngrok.pid)" >/dev/null 2>&1 || true
          fi
          if [ -s ngrok-domain-id ]; then
            ngrok api reserved-domains delete "$(cat ngrok-domain-id)" --api-key "$NGROK_API_KEY" >/dev/null 2>&1 || true
          fi

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daytona-github-issues-e2e
          path: |
            ngrok.log
            ngrok.pid
            ngrok.yml
            ngrok-domain.json
            ngrok-domain-id
