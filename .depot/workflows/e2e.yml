name: E2E

on:
  pull_request:
    paths:
      - '.depot/workflows/e2e.yml'
      - 'Makefile'
      - 'cmd/claw-bridge/**'
      - 'pkg/hub/bootstrap.go'
      - 'pkg/hub/github.go'
      - 'pkg/hub/github_issues.go'
      - 'pkg/hub/integration_poller.go'
      - 'pkg/hub/jira*.go'
      - 'pkg/hub/linear.go'
      - 'pkg/hub/pipeline_runner.go'
      - 'pkg/hub/server.go'
      - 'pkg/hub/workspace*.go'
      - 'pkg/provider/daytona/**'
      - 'pkg/provider/replicated/**'
      - 'pkg/types/**'
      - 'test/e2e/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: depot-ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
          cache: true

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run tests
        run: go test -v ./...

      - name: Bootstrap script tests (with shellcheck)
        run: go test -v ./pkg/hub/ -run TestBootstrap

      - name: Factory integration tests
        run: make test-factory

      - name: Parity matrix tests
        run: make test-parity

      - name: Install script tests (with shellcheck)
        run: go test -v ./pkg/install/ -run Test

      - name: Install container integration test
        run: ELASTICCLAW_INSTALL_TESTS=1 go test -tags integration -v ./pkg/install/ -run TestInstall_Container -timeout 5m

  build:
    name: Build
    runs-on: depot-ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
          cache: true

      - name: Build hub + CLI
        run: make build

      - name: Build claw-bridge (linux)
        run: make build-bridge-linux

  web:
    name: Web UI build
    runs-on: depot-ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install
        working-directory: web

      - name: Build (static export)
        run: npm run build
        working-directory: web

  provider-tracker:
    name: ${{ matrix.provider_name }} + ${{ matrix.tracker_name }}
    runs-on: depot-ubuntu-24.04
    needs:
      - unit
      - build
      - web
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider_name: Daytona
            provider_slug: daytona
            tracker_name: GitHub Issues
            slug: github
            test: TestDaytonaGitHubIssuesWorkflowE2E
          - provider_name: Daytona
            provider_slug: daytona
            tracker_name: Linear
            slug: linear
            test: TestDaytonaLinearWorkflowE2E
          - provider_name: Daytona
            provider_slug: daytona
            tracker_name: Jira
            slug: jira
            test: TestDaytonaJiraWorkflowE2E
          - provider_name: Replicated
            provider_slug: replicated
            tracker_name: GitHub Issues
            slug: github
            test: TestReplicatedGitHubIssuesWorkflowE2E
          - provider_name: Replicated
            provider_slug: replicated
            tracker_name: Linear
            slug: linear
            test: TestReplicatedLinearWorkflowE2E
          - provider_name: Replicated
            provider_slug: replicated
            tracker_name: Jira
            slug: jira
            test: TestReplicatedJiraWorkflowE2E
    env:
      ELASTICCLAW_E2E_BIN: ${{ github.workspace }}/bin/elasticclaw
      ELASTICCLAW_E2E_BRIDGE_BINARY: ${{ github.workspace }}/bin/claw-bridge-linux-amd64
      ELASTICCLAW_E2E_DAYTONA_SANDBOX_ID_FILE: ${{ github.workspace }}/e2e-daytona-sandbox-ids
      ELASTICCLAW_E2E_REPLICATED_VM_ID_FILE: ${{ github.workspace }}/e2e-replicated-vm-ids
      ELASTICCLAW_E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts-${{ matrix.provider_slug }}-${{ matrix.slug }}
      ELASTICCLAW_E2E_HUB_ADDR: 127.0.0.1:8080
      ELASTICCLAW_E2E_GITHUB_TOKEN: ${{ secrets.ELASTICCLAW_E2E_GITHUB_TOKEN }}
      ELASTICCLAW_E2E_GITHUB_REPO: ${{ secrets.ELASTICCLAW_E2E_GITHUB_REPO }}
      ELASTICCLAW_E2E_GITHUB_APP_ID: ${{ secrets.ELASTICCLAW_E2E_GITHUB_APP_ID }}
      ELASTICCLAW_E2E_GITHUB_APP_URL: ${{ secrets.ELASTICCLAW_E2E_GITHUB_APP_URL }}
      ELASTICCLAW_E2E_GITHUB_APP_INSTALLATION: ${{ secrets.ELASTICCLAW_E2E_GITHUB_APP_INSTALLATION }}
      ELASTICCLAW_E2E_GITHUB_APP_PRIVATE_KEY: ${{ secrets.ELASTICCLAW_E2E_GITHUB_APP_PRIVATE_KEY }}
      ELASTICCLAW_E2E_LINEAR_API_KEY: ${{ secrets.ELASTICCLAW_E2E_LINEAR_API_KEY }}
      ELASTICCLAW_E2E_LINEAR_TEAM_KEY: ${{ secrets.ELASTICCLAW_E2E_LINEAR_TEAM_KEY }}
      ELASTICCLAW_E2E_LINEAR_TRIGGER_STATE: ${{ secrets.ELASTICCLAW_E2E_LINEAR_TRIGGER_STATE }}
      ELASTICCLAW_E2E_LINEAR_INITIAL_STATE: ${{ secrets.ELASTICCLAW_E2E_LINEAR_INITIAL_STATE }}
      ELASTICCLAW_E2E_JIRA_BASE_URL: ${{ secrets.ELASTICCLAW_E2E_JIRA_BASE_URL }}
      ELASTICCLAW_E2E_JIRA_USERNAME: ${{ secrets.ELASTICCLAW_E2E_JIRA_USERNAME }}
      ELASTICCLAW_E2E_JIRA_TOKEN: ${{ secrets.ELASTICCLAW_E2E_JIRA_TOKEN }}
      ELASTICCLAW_E2E_JIRA_PROJECT_KEY: ${{ secrets.ELASTICCLAW_E2E_JIRA_PROJECT_KEY }}
      ELASTICCLAW_E2E_JIRA_MANUAL_WEBHOOK: "true"
      ELASTICCLAW_E2E_MODEL: fireworks/accounts/fireworks/models/kimi-k2p6
      ELASTICCLAW_E2E_RUN_ID: pr-${{ github.event.pull_request.number || github.run_number }}-${{ github.run_attempt }}-${{ matrix.provider_slug }}-${{ matrix.slug }}-${{ github.sha }}
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      REPLICATED_API_TOKEN: ${{ secrets.REPLICATED_API_TOKEN }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      NGROK_API_KEY: ${{ secrets.NGROK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
          cache: true

      - name: Build ElasticClaw
        run: |
          go build -o bin/elasticclaw .
          GONOSUMDB=* CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/claw-bridge-linux-amd64 ./cmd/claw-bridge/

      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update
          sudo apt-get install -y ngrok
          ngrok version

      - name: Start ngrok
        run: |
          NGROK_HOST="ec-${GITHUB_SHA:0:12}-${GITHUB_RUN_ATTEMPT}-${{ matrix.provider_slug }}-${{ matrix.slug }}-$(date +%s).ngrok-free.app"
          NGROK_API_ADDR="127.0.0.1:4049"
          echo "Creating temporary ngrok reserved domain https://$NGROK_HOST"
          ngrok api reserved-domains create \
            --api-key "$NGROK_API_KEY" \
            --domain "$NGROK_HOST" \
            --description "ElasticClaw E2E temporary tunnel" \
            --metadata "elasticclaw-e2e" > ngrok-domain.json
          python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))' < ngrok-domain.json > ngrok-domain-id
          if [ ! -s ngrok-domain-id ]; then
            cat ngrok-domain.json
            echo "ngrok reserved domain create did not return an id"
            exit 1
          fi
          sleep 5
          echo "Starting ngrok tunnel https://$NGROK_HOST for localhost:8080"
          printf 'version: "3"\nagent:\n  web_addr: "%s"\n' "$NGROK_API_ADDR" > ngrok.yml
          ngrok http 8080 --url "https://$NGROK_HOST" --authtoken "$NGROK_AUTHTOKEN" --config ngrok.yml --log stdout > ngrok.log 2>&1 &
          echo "$!" > ngrok.pid
          for i in $(seq 1 120); do
            if ! kill -0 "$(cat ngrok.pid)" >/dev/null 2>&1; then
              echo "ngrok exited before the local API became ready"
              cat ngrok.log
              exit 1
            fi
            if ! curl -fsS --connect-timeout 2 --max-time 5 "http://$NGROK_API_ADDR/api/tunnels" > ngrok-tunnels.json 2>/dev/null; then
              sleep 1
              continue
            fi
            url="$(python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((t["public_url"] for t in data.get("tunnels", []) if t.get("proto") == "https"), ""))' < ngrok-tunnels.json 2>/dev/null || true)"
            if [ -n "$url" ]; then
              case "$url" in
                *://elasticclaw.ngrok.app*)
                  echo "Refusing shared ngrok domain: $url"
                  exit 1
                  ;;
              esac
              echo "ELASTICCLAW_E2E_PUBLIC_URL=$url" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "ngrok tunnel did not become ready"
          cat ngrok.log
          exit 1

      - name: Run ${{ matrix.provider_name }} ${{ matrix.tracker_name }} E2E
        run: |
          mkdir -p "$ELASTICCLAW_E2E_ARTIFACT_DIR"
          set -o pipefail
          go test -tags e2e -v ./test/e2e -run "${{ matrix.test }}" -count=1 -timeout 30m 2>&1 | tee "$ELASTICCLAW_E2E_ARTIFACT_DIR/go-test.log"

      - name: Cleanup recorded sandboxes
        if: always()
        run: go test -tags e2e -v ./test/e2e -run 'TestCleanupRecorded(DaytonaSandboxes|ReplicatedVMs)' -count=1 -timeout 6m

      - name: Stop ngrok
        if: always()
        run: |
          if [ -f ngrok.pid ]; then
            kill "$(cat ngrok.pid)" >/dev/null 2>&1 || true
          fi
          if [ -s ngrok-domain-id ]; then
            ngrok api reserved-domains delete "$(cat ngrok-domain-id)" --api-key "$NGROK_API_KEY" >/dev/null 2>&1 || true
          fi

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.provider_slug }}-${{ matrix.slug }}
          path: |
            ngrok.log
            ngrok.pid
            ngrok.yml
            ngrok-tunnels.json
            ngrok-domain.json
            ngrok-domain-id
            e2e-daytona-sandbox-ids
            e2e-replicated-vm-ids
            e2e-artifacts-*
