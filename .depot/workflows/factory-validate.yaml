name: Validate Factory

on:
  pull_request:
    paths:
      - '.elasticclaw/**'

jobs:
  validate:
    name: Validate ElasticClaw Config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate factory (elasticclaw)
        uses: elasticclaw/actions/publish-factory@main
        with:
          hub-endpoint: https://factory.elasticclaw.ai
          token: ${{ secrets.ELASTICCLAW_TOKEN }}
          path: .elasticclaw/factories/elasticclaw
          dry-run: true

      - name: Validate factory (existing-pr)
        uses: elasticclaw/actions/publish-factory@main
        with:
          hub-endpoint: https://factory.elasticclaw.ai
          token: ${{ secrets.ELASTICCLAW_TOKEN }}
          path: .elasticclaw/factories/existing-pr
          dry-run: true

      - name: Validate factory (design)
        uses: elasticclaw/actions/publish-factory@main
        with:
          hub-endpoint: https://factory.elasticclaw.ai
          token: ${{ secrets.ELASTICCLAW_TOKEN }}
          path: .elasticclaw/factories/design
          dry-run: true

      - name: Validate factory (bug-research)
        uses: elasticclaw/actions/publish-factory@main
        with:
          hub-endpoint: https://factory.elasticclaw.ai
          token: ${{ secrets.ELASTICCLAW_TOKEN }}
          path: .elasticclaw/factories/bug-research
          dry-run: true

      - name: Validate template
        uses: elasticclaw/actions/publish-template@main
        with:
          hub-endpoint: https://factory.elasticclaw.ai
          token: ${{ secrets.ELASTICCLAW_TOKEN }}
          path: .elasticclaw/templates/elasticclaw
          dry-run: true