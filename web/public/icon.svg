<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <circle cx="16" cy="16" r="16" fill="#111"/>

  <!-- Claw arm (red) -->
  <path d="M7 26 C7 23 9 20 12 19 L15 18 L15 12 C15 10.3 16.3 9 18 9 C19.7 9 21 10.3 21 12 L21 14.5" stroke="#c92a2a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Upper pincer -->
  <path d="M21 14.5 C23 14 25.5 14 26.5 12.5 C27.2 11.4 26.5 10 25 10"
        stroke="#c92a2a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Lower pincer -->
  <path d="M21 14.5 C23 15.5 25 16.5 25.5 18.5 C26 20.2 24.8 21.5 23 21.5"
        stroke="#c92a2a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Claw gap tip -->
  <path d="M25 10 C27 11 27.5 13 26.5 14.5"
        stroke="#c92a2a" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Lightning bolt (amber, slightly offset left so it's gripped by claw) -->
  <polygon points="18,7 13.5,17 17,17 12,27 20.5,15 17,15" fill="#f59f00" opacity="0.95"/>
</svg>
