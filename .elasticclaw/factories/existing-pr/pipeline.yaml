stages:
  - id: working
    label: "Working"
    entry: true
    on_enter:
      inject: |
        You are responsible for getting github.com/{{ .Inputs.repo }}#{{ .Inputs.pr_number }} to a mergeable state.
        That means: resolve and fix any Greptile comments you agree with, watch for human review comments, and make sure CI is green.

        Read BOOTSTRAP.md and AGENTS.md. 
        Before you start, describe your understanding of your instructions.
        Then, in a seperate message, describe your understanding of the PR.
        Narrate your progress as you go.

  - id: merged
    label: "Merged"
    on_enter:
      inject: |
        Pull request merged. Terminating the agent.
    triggers:
      - pr_merged:
          terminal: true

  - id: closed_no_merge
    label: "Closed Without Merge"
    triggers:
      - pr_closed:
    on_enter:
      inject: |
        Pull request was closed without merging. Terminate the agent.
