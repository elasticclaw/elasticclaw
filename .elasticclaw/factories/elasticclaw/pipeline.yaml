stages:
  - id: working
    label: "Working"
    entry: true
    on_enter:
      add_labels:
        - "agent-working"
      remove_labels:
        - "agent-ready"
      inject: |
        Read your BOOTSTRAP.md and start working on the issue.
        Narrate your progress as you go. Keep me updated.

  - id: pr_opened
    label: "PR Opened"
    triggers:
      - message_contains: "[DONE]"
    on_enter:
      add_labels:
        - "agent-needs-review"
      remove_labels:
        - "agent-working"
      inject: |
        Issue: {{.Issue.Identifier}} — {{.Issue.Title}}
        URL: {{.Issue.URL}}

        Read your BOOTSTRAP.md and start working on the issue.
        Narrate your progress as you go. Keep me updated.

  - id: merged
    label: "Merged"
    on_enter:
      add_labels:
        - "done"
      remove_labels:
        - "agent-needs-review"
      close_issue: true
    triggers:
      - pr_merged:
          terminal: true

  - id: closed_no_merge
    label: "Closed Without Merge"
    triggers:
      - pr_closed:
    on_enter:
      add_labels:
        - "wontfix"
      remove_labels:
        - "agent-needs-review"
      inject: |
        PR was closed without merging. Terminate the agent.