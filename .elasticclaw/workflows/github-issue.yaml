schema_version: v1
name: github-issue

enable_manual_trigger: true

inputs:
  - name: issue_number
    type: number
    required: true
    min: 1
    description: GitHub issue number to run this workflow against.

trigger:
  github_issues:
    event: issue_labeled
    repositories:
      - elasticclaw/elasticclaw
    states:
      - open
    labels:
      - agent-ready
    labelers:
      - "*"

concurrency_group: global

stages:
  - id: working
    label: Working
    entry: true
    on_enter:
      remove_labels:
        - agent-ready
      add_labels:
        - agent-working
      inject: |
        Issue: {{.Issue.Identifier}} — {{.Issue.Title}}
        URL: {{.Issue.URL}}

        Read the issue and CONTEXT.md and start working on the issue.
        Narrate your progress as you go. Keep me updated.
        When implementation is complete and before committing, reply with `[READY_TO_COMMIT]`
        alone on the first line of your message. The hub only reads the signal when the
        token opens a line; written inside a sentence it is ignored and the run stalls.

  - id: pre_commit
    label: Pre-Commit Checks
    triggers:
      - message_contains: "[READY_TO_COMMIT]"
    on_enter:
      run:
        command: mkdir -p .elasticclaw/clawpatch && clawpatch ci --format json --output .elasticclaw/clawpatch/report.json
        continue_on_error: true
        timeout: 15m
      inject: |
        Review the clawpatch report at .elasticclaw/clawpatch/report.json.
        Fix issues you agree with.
        Do not commit .elasticclaw/clawpatch files.
        When fixes are complete, create the final commit and PR, then reply with `[DONE]` on
        the first line and list the PR URL after it. `[DONE]` must open that line.

  - id: pr_opened
    label: PR Opened
    triggers:
      - message_contains: "[DONE]"
    on_enter:
      add_labels:
        - agent-needs-review
      remove_labels:
        - agent-working
      inject: |
        PR created. Watch for CI results and review comments.

  - id: merged
    label: Merged
    on_enter:
      add_labels:
        - done
      remove_labels:
        - agent-needs-review
    triggers:
      - pr_merged: {}
    terminal: true

  - id: closed_no_merge
    label: Closed Without Merge
    triggers:
      - pr_closed: {}
    on_enter:
      add_labels:
        - wontfix
      remove_labels:
        - agent-needs-review
      inject: |
        PR was closed without merging. Terminate the agent.
    terminal: true
