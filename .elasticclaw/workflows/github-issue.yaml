schema_version: v1
name: github-issue

trigger:
  type: github_issues
  event: issue_labeled
  repositories:
    - elasticclaw/elasticclaw
  states:
    - open
  labels:
    - agent-ready
  labelers:
    - "*"

concurrency_group: ddd

jobs:
  - id: working
    label: Working
    entry: true
    on_enter:
      remove_labels:
        - agent-ready
      add_labels:
        - agent-working
      inject: |
        Issue: {{.Issue.Identifier}} — {{.Issue.Title}}
        URL: {{.Issue.URL}}

        Read the issue and CONTEXT.md and start working on the issue.
        Narrate your progress as you go. Keep me updated.

  - id: pr_opened
    label: PR Opened
    triggers:
      - message_contains: "[DONE]"
    on_enter:
      add_labels:
        - agent-needs-review
      remove_labels:
        - agent-working
      inject: |
        PR created. Watch for CI results and review comments.

  - id: merged
    label: Merged
    on_enter:
      add_labels:
        - done
      remove_labels:
        - agent-needs-review
    triggers:
      - pr_merged: {}
    terminal: true

  - id: closed_no_merge
    label: Closed Without Merge
    triggers:
      - pr_closed: {}
    on_enter:
      add_labels:
        - wontfix
      remove_labels:
        - agent-needs-review
      inject: |
        PR was closed without merging. Terminate the agent.
