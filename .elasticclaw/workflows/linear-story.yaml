schema_version: v1
name: linear-story

trigger:
  linear:
    event: status_changed
    states:
      - Todo

concurrency_group: global

stages:
  - id: working
    label: Working
    entry: true
    on_enter:
      move_issue: In Progress
      inject: |
        Issue: {{.Issue.Identifier}} - {{.Issue.Title}}
        URL: {{.Issue.URL}}

        Read the issue and CONTEXT.md and start working on the issue.
        Narrate your progress as you go. Keep me updated.
        When the PR is open, reply with `[DONE]` on the first line and list the PR URL after
        it. The hub reads the signal only when `[DONE]` opens a line; mentioned inside a
        sentence it is ignored.

  - id: pr_opened
    label: PR Opened
    triggers:
      - message_contains: "[DONE]"
    on_enter:
      inject: |
        PR created. Watch for CI results and review comments.

  - id: merged
    label: Merged
    triggers:
      - pr_merged: {}
    on_enter:
      move_issue: Done
    terminal: true

  - id: closed_no_merge
    label: Closed Without Merge
    triggers:
      - pr_closed: {}
    on_enter:
      move_issue: Canceled
      inject: |
        PR was closed without merging. Terminate the agent.
    terminal: true
