        sshPublicKeys:
          type: array
          items: { type: string }
        integrations:
          $ref: "#/components/schemas/IntegrationsPatch"
        factories:
          type: array
          items:
            $ref: "#/components/schemas/FactoryPatch"
        mcpServers:
          type: array
          items:
            $ref: "#/components/schemas/MCPPatch"
        auth:
          $ref: "#/components/schemas/AuthPatch"
        concurrencyGroups:
          type: array
          items:
            $ref: "#/components/schemas/ConcurrencyGroupPatch"
        maxConcurrentClaws:
          type: integer
          description: "DEPRECATED: use concurrencyGroups instead."

    ModelAuthLoginRequest:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [codex, grok]
        profile: { type: string }
        mode:
          type: string
          enum: [device]

    ModelAuthLoginJob:
      type: object
      required: [id, provider, profile, status, startedAt, updatedAt]
      properties:
        id: { type: string }
        provider: { type: string }
        profile: { type: string }
        status:
          type: string
          enum: [running, complete, error]
        url: { type: string }
        code: { type: string }
        output: { type: string }
        error: { type: string }
        startedAt: { type: string }
        updatedAt: { type: string }

    AIChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string }
