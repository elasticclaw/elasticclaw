name: deterministic-gate-pass
entry: entry

stages:
  - id: entry
    label: Entry
    entry: true
    on_enter:
      inject: |
        Starting deterministic validation. Say [DONE] to run the validator.

  - id: validation
    label: Validation
    triggers:
      - message_contains: "[DONE]"
    on_enter:
      run:
        command: "python3 scripts/deterministic_gate.py --mode pass"
        output: validation
    gate:
      output: validation
      pass:
        path: status
        values:
          - clean
      fail:
        path: status
        values:
          - issues
      required: true

  - id: complete
    label: Complete
    triggers:
      - gate_result:
          stage: validation
          verdict: pass
    on_enter:
      inject: |
        No issues found. Workflow complete.
