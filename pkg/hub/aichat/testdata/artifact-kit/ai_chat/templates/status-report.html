<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Status report</title>
<meta name="template:description" content="A project update with progress, milestones, risks and decisions.">
<meta name="template:when" content="Use for weekly updates, project status or milestone reviews.">
<style data-template-layout>.report { max-width: 1000px; margin: auto; display: grid; gap: 1.5rem; } .report h1 { margin-bottom: .5rem; }</style>
</head><body class="ds-page"><main class="report">
<header data-slot="overview" data-slot-hint="Name the project, period and overall status."><h1>Project Evergreen</h1><span class="ds-badge">On track</span><p>Week 12</p></header>
<section class="ds-card" data-slot="milestone" data-slot-hint="Summarize one milestone with date and status." data-slot-repeat><h2>First release</h2><p>Sample milestone: planned for Friday.</p></section>
<section class="ds-card" data-slot="risks" data-slot-hint="Describe known risks, owners and mitigation." data-slot-optional><h2>Risks</h2><p>Awaiting stakeholder feedback.</p></section>
<section class="ds-card" data-slot="decisions" data-slot-hint="List decisions and next steps."><h2>Next steps</h2><p>Review the release checklist.</p></section>
</main></body></html>
