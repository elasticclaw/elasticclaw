<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>One-pager</title>
<meta name="template:description" content="A concise proposal with evidence, recommendations and next steps.">
<meta name="template:when" content="Use for a proposal, executive brief or focused product idea.">
<style data-template-layout>.sections { display: grid; gap: 1rem; max-width: 960px; margin: auto; } .metrics { display: flex; gap: 2rem; }</style>
</head><body class="ds-page"><main class="sections">
<header data-slot="summary" data-slot-hint="State the title and concise proposal."><h1>Reduce onboarding friction</h1><p>Help new teams reach their first useful result.</p></header>
<section class="metrics"><div data-slot="metric" data-slot-hint="Show one evidenced metric and label." data-slot-repeat><strong class="ds-stat">24%</strong><p>Sample activation rate</p></div></section>
<section class="ds-card" data-slot="recommendation" data-slot-hint="Explain the recommendation and evidence."><h2>Recommendation</h2><p>Shorten the first setup step.</p></section>
<section class="ds-card" data-slot="next-steps" data-slot-hint="List agreed next steps, if any." data-slot-optional><h2>Next steps</h2><p>Validate with five teams.</p></section>
</main></body></html>
