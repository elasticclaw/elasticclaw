extensions:
  health_check:
    endpoint: ${env:COLLECTOR_HEALTH_ENDPOINT}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTLP_GRPC_ENDPOINT}
      http:
        endpoint: ${env:OTLP_HTTP_ENDPOINT}
  host_metrics:
    collection_interval: 15s
    root_path: ${env:HOST_ROOT}
    scrapers:
      cpu: {}
      memory: {}
      filesystem:
        metrics:
          system.filesystem.inodes.usage:
            enabled: true
      disk: {}
      network: {}
      load: {}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 80
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  otlp_http/metrics:
    endpoint: ${env:METRICS_ENDPOINT}
  otlp_http/logs:
    endpoint: ${env:LOGS_ENDPOINT}
  otlp_grpc/tempo:
    endpoint: ${env:TRACES_ENDPOINT}
    tls:
      insecure: true

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: none
  pipelines:
    metrics:
      receivers: [otlp, host_metrics]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/logs]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
