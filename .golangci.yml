version: "2"

linters:
  enable:
    # contextcheck prevents regressions of the phase-2.3 sweep: HTTP
    # handlers must propagate r.Context(); work that outlives a request
    # derives from the hub root context (Server.baseCtx), never from a
    # bare context.Background() inside a call chain that already has one.
    - contextcheck
    - depguard
    - forbidigo
  settings:
    depguard:
      # Dependency direction between pkg/hub subpackages (re-arch phase 2.1):
      #
      #   httpserver -> (nothing but logger)   # router sees handlers via interfaces
      #   services   -> store, pkg/types       # never each other's internals upward
      #   integrations/workflows -> claws      # allowed (an event may create a claw)
      #   claws      -> neither of them        # core stays at the bottom
      #   store      -> pkg/types only         # rule active once store/ exists (2.4)
      #
      # Note: service packages currently import httpserver for the shared
      # response helpers (JSONOK/JSONError/WriteErr). That is tolerated until
      # the error-envelope mapping is centralized (phase 2.5); the rules below
      # enforce the directions that must never regress.
      rules:
        hub-httpserver:
          files:
            - "**/pkg/hub/httpserver/**"
          deny:
            - pkg: github.com/elasticclaw/elasticclaw/pkg/hub/claws
              desc: httpserver must not know the services; the route table takes handlers via interfaces
            - pkg: github.com/elasticclaw/elasticclaw/pkg/hub/integrations
              desc: httpserver must not know the services; the route table takes handlers via interfaces
            - pkg: github.com/elasticclaw/elasticclaw/pkg/hub/workflows
              desc: httpserver must not know the services; the route table takes handlers via interfaces
            - pkg: github.com/elasticclaw/elasticclaw/pkg/hub/checkpoints
              desc: httpserver must not know the services; the route table takes handlers via interfaces
            - pkg: github.com/elasticclaw/elasticclaw/pkg/hub/analytics
              desc: httpserver must not know the services; the route table takes handlers via interfaces
            - pkg: github.com/elasticclaw/elasticclaw/pkg/hub/settings
              desc: httpserver must not know the services; the route table takes handlers via interfaces
            - pkg: github.com/elasticclaw/elasticclaw/pkg/hub/store
              desc: httpserver must not touch the data layer directly; go through a service
        hub-claws:
          files:
            - "**/pkg/hub/claws/**"
          deny:
            - pkg: github.com/elasticclaw/elasticclaw/pkg/hub/integrations
              desc: claws is the core; integrations may call claws, never the reverse
            - pkg: github.com/elasticclaw/elasticclaw/pkg/hub/workflows
              desc: claws is the core; workflows may call claws, never the reverse
        hub-store:
          files:
            - "**/pkg/hub/store/**"
          deny:
            - pkg: github.com/elasticclaw/elasticclaw/pkg/hub
              desc: store only knows pkg/types; move shared types down instead of importing upward
    forbidigo:
      forbid:
        # Structured logging only in the hub: use logger.FromContext(ctx) /
        # the logf/logfCtx bridges instead of the stdlib printf-style loggers.
        - pattern: '^log\.(Print|Printf|Println)$'
          msg: use log/slog (logger.FromContext or the logf/logfCtx bridges) instead of the stdlib log package
        - pattern: '^fmt\.(Print|Printf|Println)$'
          msg: use log/slog instead of printing to stdout
  exclusions:
    rules:
      # contextcheck: these sinks intentionally run on the hub root context
      # (Server.baseCtx) because their work outlives any single request —
      # user-WS fanout, queued message delivery, checkpoints, shared
      # singleflight refreshes, cleanup after provisioning failures.
      # Threading request contexts through the bridge hooks they sit behind
      # is part of the remaining phase-2 extraction steps; new bare
      # context.Background() call sites are still flagged.
      - linters:
          - contextcheck
        text: "(sendNextQueuedMessage|clawTagsForBroadcast|tenantByToken|hasSystemMarker|clawHasMessages|CheckpointBeforeTermination|provisionStoredClaw|DrainPendingCheckpoint|snapshot\\$1|checkFactories|runModelAuthLoginJob|loadHubTemplate|handleTroubleshootStream|createClawFromFactory|cleanupClaw|flushStreamingSegment|createClawForExternalEvent|buildGitHubIssuesContextWithComments|createClawForGitHubPR|ProvisionPendingClaw|setReady|checkGateway)"
      # The structured-logging rule applies to the hub only (for now); the CLI
      # under cmd/ legitimately prints to stdout.
      - path-except: ^pkg/hub/
        linters:
          - forbidigo
      # Test scaffolding (fake claw bridge) prints progress to stdout on purpose.
      - path: ^pkg/hub/factorytest/
        linters:
          - forbidigo
